<!doctype html>
<meta charset="utf-8">
<title>GNB — written from the IR</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #17171c;
    --ink-muted: #4a4a55;
    --surface: #fff;
    --neutral: #2f2f3a;
    --primary: #4071e2;
    --chip: #f1f2f4;
    --radius-pill: 999px;
    --radius-md: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 500 16px/1.4 Inter, system-ui, sans-serif; color: var(--ink); background: #f5f5f7; }

  .gnb { display: flex; align-items: center; gap: 24px; height: 60px; padding: 8px 16px;
         background: var(--surface); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; line-height: 1.1;
           color: inherit; text-decoration: none; }
  .brand svg { width: 32px; height: 32px; }
  .brand span { font-size: 13px; color: var(--primary); }

  .menu { display: flex; align-items: center; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .menu a { display: inline-flex; align-items: center; gap: 4px; padding: 13px 12px;
            font-size: 15px; color: var(--ink); text-decoration: none; border-radius: var(--radius-md); }
  .menu a:hover { background: var(--chip); }
  .menu a[aria-expanded]::after { content: ""; width: 8px; height: 8px; border-right: 1.5px solid currentColor;
            border-bottom: 1.5px solid currentColor; transform: rotate(45deg) translate(-2px, -2px); }

  .actions { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px;
         border: 0; border-radius: var(--radius-pill); font: inherit; font-size: 15px; cursor: pointer; }
  .btn-neutral { background: var(--neutral); color: #fff; }
  .btn-primary { background: var(--primary); color: #fff; }

  .account { display: flex; align-items: center; gap: 16px; padding-right: 16px;
             background: var(--chip); border-radius: var(--radius-pill); }
  .account img, .account .avatar { width: 44px; height: 44px; border-radius: var(--radius-md);
             background: #dfe3ea; display: grid; place-items: center; overflow: hidden; }
  .account .name { font-size: 16px; color: var(--ink-muted); }

  .hamburger { width: 24px; height: 24px; display: grid; gap: 5px; align-content: center;
               background: none; border: 0; cursor: pointer; }
  .hamburger i { display: block; height: 2px; background: var(--ink); border-radius: 1px; }
</style>

<header class="gnb">
  <a class="brand" href="/">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="#2b4fb5" stroke-width="2"/><path d="M16 8 24 16 16 24 8 16Z" fill="none" stroke="#2b4fb5" stroke-width="2"/></svg>
    <span>materials<br>square</span>
  </a>

  <nav aria-label="Primary">
    <ul class="menu">
      <li><a href="#" aria-expanded="false">Products</a></li>
      <li><a href="#" aria-expanded="false">Solutions</a></li>
      <li><a href="#" aria-expanded="false">Resources</a></li>
      <li><a href="#">Pricing</a></li>
      <li><a href="#">Community</a></li>
    </ul>
  </nav>

  <div class="actions">
    <button class="btn btn-neutral" type="button">＋ Button →</button>
    <button class="btn btn-primary" type="button">＋ Button</button>
    <div class="account">
      <span class="avatar" aria-hidden="true">
        <svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="18" r="8" fill="#4071e2"/><path d="M6 44a16 16 0 0 1 32 0Z" fill="#4071e2"/></svg>
      </span>
      <span class="name">Matthew</span>
    </div>
    <button class="hamburger" type="button" aria-label="Menu"><i></i><i></i><i></i></button>
  </div>
</header>
